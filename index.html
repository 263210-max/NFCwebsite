<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>자수정 강화소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfcfb;
    --ink:#241832;
    --ink-soft:#5c4b74;
    --amethyst:#6c3fa8;
    --surface:#ffffff;
    --surface-dim:#f1ecf7;
    --overlay:rgba(20,12,30,.55);
    --card-shadow:0 22px 60px rgba(40,20,60,.22);
    --gold:#c97f14;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#140e20; --ink:#f4eefc; --ink-soft:#c6b3e2;
      --surface:#1f1730; --surface-dim:#271d3a;
      --overlay:rgba(0,0,0,.6);
      --card-shadow:0 22px 60px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#140e20; --ink:#f4eefc; --ink-soft:#c6b3e2;
    --surface:#1f1730; --surface-dim:#271d3a;
    --overlay:rgba(0,0,0,.6);
    --card-shadow:0 22px 60px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Gothic A1',sans-serif;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    transition:background-color .5s ease;
  }
  button{font-family:inherit;}
  button:focus-visible{outline:3px solid #e14ec0;outline-offset:3px;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    position:relative;
    z-index:10;
    min-height:30px;
  }
  .timerPill{
    font-family:'Black Han Sans',sans-serif;
    font-size:15px;
    background:var(--surface);
    color:var(--ink);
    padding:7px 16px;
    border-radius:999px;
    box-shadow:0 4px 16px rgba(80,50,120,.15);
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease;
  }
  .timerPill.show{opacity:1;visibility:visible;}
  .dexBtn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--surface-dim);
    color:var(--ink);
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(80,50,120,.08);
    transition:transform .15s ease;
  }
  .dexBtn:active{transform:scale(.94);}
  .dexBtn svg{width:16px;height:16px;}

  #stage{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  #eventLayerBack, #eventLayerFront{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  #eventLayerBack{z-index:1;}
  #eventLayerFront{z-index:3;}

  .hypeLayer{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    will-change:transform;
  }
  .crystalWrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    touch-action:none;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #scoreDisplay{
    font-family:'Black Han Sans',sans-serif;
    line-height:1;
    text-align:center;
    min-height:1px;
    opacity:0;
    transition:opacity .2s ease;
    font-size:44px;
    color:var(--amethyst);
    word-break:keep-all;
  }
  #scoreDisplay.show{opacity:1;}

  #crystalBtn{
    appearance:none;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    cursor:pointer;
    display:block;
    line-height:0;
    transform-origin:50% 60%;
    transition:transform .09s ease-out;
  }
  #crystalBtn.pressed{transform:scale(.9);}
  #crystalSvgWrap{display:block;}
  #crystalBtn svg{
    width:min(52vw,230px);
    height:auto;
    display:block;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 16px rgba(140,90,200,.45));
  }
  #crystalBtn svg.legendarySpin{animation:hueSpin 2.6s linear infinite;}
  @keyframes hueSpin{
    0%{filter:hue-rotate(0deg) drop-shadow(0 0 40px rgba(230,160,60,.65));}
    100%{filter:hue-rotate(360deg) drop-shadow(0 0 40px rgba(230,160,60,.65));}
  }
  @keyframes spin360{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  #crystalBtn.spinOnce{animation:spin360 .8s ease-in-out;}
  @media (prefers-reduced-motion: reduce){
    #crystalBtn svg.legendarySpin, #crystalBtn.spinOnce{animation:none;}
  }

  .sparkle{animation:twinkle 1.9s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .sparkle{animation:none;opacity:.7;} }

  .instruction{
    font-size:15px;
    color:var(--ink-soft);
    text-align:center;
    max-width:280px;
    line-height:1.55;
    min-height:44px;
  }
  .bestScore{font-size:13px;color:var(--ink-soft);opacity:.7;}

  /* ===== 연출 이펙트 ===== */
  .fx{position:absolute;inset:0;}
  .fx-wrap{overflow:hidden;}
  .fx-darken{background:#07040c;opacity:0;animation:feFadeInOut 2.2s ease both;}
  @keyframes feFadeInOut{0%{opacity:0;}20%{opacity:.6;}80%{opacity:.6;}100%{opacity:0;}}
  .fx-flash{background:#fff;opacity:0;animation:feFlash .9s ease both;}
  .fx-flash.slow{animation-duration:2.6s;background:radial-gradient(circle,#fff 0%,#2a1a40 70%);}
  @keyframes feFlash{0%{opacity:0;}6%{opacity:.9;}14%{opacity:0;}38%{opacity:0;}46%{opacity:.55;}55%{opacity:0;}100%{opacity:0;}}
  .fx-fire{background:radial-gradient(circle at 50% 100%, rgba(255,120,30,.75), rgba(255,60,10,.35) 45%, transparent 75%);opacity:0;animation:feFadeInOut 2s ease both;}
  .fx-flood{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top, rgba(30,120,180,.55), rgba(90,190,220,.25));animation:feFlood 2.6s ease both;}
  @keyframes feFlood{0%{height:0;opacity:0;}25%{opacity:1;}60%{height:72%;opacity:1;}100%{height:0;opacity:0;}}

  .drop{position:absolute;top:-8%;width:2px;height:22px;background:linear-gradient(to bottom, transparent, rgba(110,170,230,.75));animation-name:feFallDown;animation-timing-function:linear;animation-iteration-count:3;}
  @keyframes feFallDown{0%{transform:translateY(-10%);opacity:.9;}100%{transform:translateY(900%);opacity:.2;}}
  .snow{position:absolute;top:-6%;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);animation-name:feSnowFall;animation-timing-function:ease-in;animation-iteration-count:2;}
  @keyframes feSnowFall{0%{transform:translate(0,-10%);opacity:.9;}100%{transform:translate(12px,700%);opacity:.3;}}

  .pulseRing{position:absolute;left:50%;top:44%;width:10px;height:10px;margin:-5px 0 0 -5px;border:3px solid transparent;border-radius:50%;animation:fePulseRing .85s ease-out forwards;}
  @keyframes fePulseRing{0%{width:10px;height:10px;margin:-5px 0 0 -5px;opacity:.9;}100%{width:360px;height:360px;margin:-180px 0 0 -180px;opacity:0;}}

  .confetti{position:absolute;top:-4%;animation-name:feConfetti;animation-timing-function:linear;animation-fill-mode:forwards;}
  @keyframes feConfetti{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(115vh) rotate(540deg);opacity:.85;}}

  .burstSpark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.8);animation:feGrowShrink .9s ease both;}
  @keyframes feGrowShrink{0%{transform:scale(0);opacity:0;}30%{transform:scale(1.6);opacity:1;}100%{transform:scale(0);opacity:0;}}

  .ufo{position:absolute;left:-18%;width:64px;height:24px;animation:feFloatAcross 2.1s linear both;}
  .ufo::before{content:"";position:absolute;left:8px;top:8px;width:48px;height:12px;background:#5b6b73;border-radius:50%;}
  .ufo::after{content:"";position:absolute;left:22px;top:0;width:20px;height:12px;background:#9fe6c8;border-radius:50% 50% 0 0;}
  @keyframes feFloatAcross{0%{transform:translateX(0);}100%{transform:translateX(145vw);}}

  .treeFx{position:absolute;bottom:0;width:10px;height:0;background:#6b4a2b;animation:feTreeGrow 2.4s ease both;}
  .treeFx::after{content:"";position:absolute;left:50%;bottom:100%;width:70px;height:70px;transform:translateX(-50%) scale(0);background:#3f8a4c;border-radius:50%;animation:feLeafGrow 2.4s ease both;}
  @keyframes feTreeGrow{0%{height:0;opacity:0;}30%{opacity:1;}60%{height:90px;opacity:1;}100%{height:90px;opacity:0;}}
  @keyframes feLeafGrow{0%{transform:translateX(-50%) scale(0);opacity:0;}35%{opacity:1;}60%{transform:translateX(-50%) scale(1);opacity:1;}100%{transform:translateX(-50%) scale(1);opacity:0;}}

  .meteor{position:absolute;left:-10%;width:90px;height:4px;background:linear-gradient(to left, #fff, rgba(255,200,120,0));border-radius:4px;animation:feMeteor 1s ease-in both;}
  @keyframes feMeteor{0%{transform:translate(0,0) rotate(-24deg);opacity:0;}15%{opacity:1;}100%{transform:translate(130vw,80vh) rotate(-24deg);opacity:0;}}

  .earthFx{position:absolute;left:50%;top:45%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #7fd0e8, #2a6fb0 55%, #163a63 100%);animation:feEarthGone 2.6s ease both;}
  @keyframes feEarthGone{0%{transform:scale(0) rotate(0deg);opacity:0;}25%{transform:scale(1) rotate(60deg);opacity:1;}70%{transform:scale(1) rotate(260deg);opacity:1;}85%{transform:scale(.05) rotate(340deg);opacity:1;}100%{transform:scale(0) rotate(380deg);opacity:0;}}

  .modalOverlay{
    position:fixed;inset:0;background:var(--overlay);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;
  }
  .modalOverlay.open{opacity:1;pointer-events:auto;}
  .modalCard{
    background:var(--surface);border-radius:22px;padding:30px 26px 26px;
    max-width:380px;width:100%;max-height:86vh;overflow-y:auto;
    box-shadow:var(--card-shadow);position:relative;text-align:center;
  }
  .closeBtn{
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    border:none;background:var(--surface-dim);color:var(--ink);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  #resultCrystalWrap{width:200px;height:auto;margin:6px auto 10px;}
  #resultCrystalWrap svg{width:100%;height:auto;image-rendering:pixelated;}
  .scenePanel{border-radius:10px;}
  .badge{
    display:inline-block;background:var(--gold);color:#fff;font-weight:700;font-size:12.5px;
    padding:5px 13px;border-radius:999px;margin-bottom:10px;
  }
  #resultName{font-family:'Black Han Sans',sans-serif;font-size:22px;margin:2px 0 10px;line-height:1.35;}
  #resultScore{font-size:15px;color:var(--ink-soft);margin:0 0 22px;}
  .modalBtnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btnPrimary{
    background:var(--amethyst);color:#fff;border:none;padding:12px 22px;border-radius:999px;
    font-family:'Black Han Sans',sans-serif;font-size:15px;cursor:pointer;
  }
  .btnGhost{
    background:transparent;border:1.5px solid var(--amethyst);color:var(--amethyst);
    padding:10.5px 18px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;
  }

  #dexModal .modalCard{max-width:520px;text-align:left;}
  .dexHeader{font-family:'Black Han Sans',sans-serif;font-size:19px;margin:0 30px 4px 0;}
  .dexSub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
  .dexCell{
    background:var(--surface-dim);border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:8px 4px 7px;text-align:center;
  }
  .dexIcon{width:72px;height:72px;display:flex;align-items:center;justify-content:center;}
  .dexIcon svg{width:100%;height:100%;image-rendering:pixelated;}
  .dexCell.locked .dexIcon svg{opacity:.3;filter:grayscale(1);}
  .dexName{font-size:10.5px;line-height:1.25;margin-top:4px;min-height:26px;color:var(--ink);}
  .dexCell.locked .dexName{color:var(--ink-soft);}
  .dexNum{font-size:10px;color:var(--ink-soft);margin-top:2px;font-family:'Black Han Sans',sans-serif;}

  @media (max-width:420px){
    .modalCard{padding:24px 18px 20px;}
    .dexGrid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="timerPill" id="timerPill" aria-hidden="true">0:46</div>
    <button class="dexBtn" id="openDexBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12V20H5.5C4.7 20 4 19.3 4 18.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H12V20H18.5C19.3 20 20 19.3 20 18.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>도감</span>
    </button>
  </div>

  <main id="stage">
    <div id="eventLayerBack" aria-hidden="true"></div>
    <div class="hypeLayer" id="hypeLayer">
      <div class="crystalWrap">
        <div id="scoreDisplay" aria-hidden="true"></div>
        <button id="crystalBtn" type="button" aria-label="자수정을 길게 눌러 강화하기">
          <span id="crystalSvgWrap" aria-hidden="true"></span>
        </button>
      </div>
      <p class="instruction" id="instructionText">이미지를 길게 눌러 자수정을 강화해보세요</p>
      <p class="bestScore" id="bestScoreText"></p>
    </div>
    <div id="eventLayerFront" aria-hidden="true"></div>
  </main>

  <div class="modalOverlay" id="resultModal" role="dialog" aria-modal="true" aria-label="강화 결과">
    <div class="modalCard">
      <button class="closeBtn" id="resultCloseBtn" type="button" aria-label="닫기">×</button>
      <div id="resultBadgeWrap"></div>
      <div id="resultCrystalWrap"></div>
      <h2 id="resultName"></h2>
      <p id="resultScore"></p>
      <div class="modalBtnRow">
        <button class="btnGhost" id="resultDexBtn" type="button">도감 보기</button>
        <button class="btnPrimary" id="resultRetryBtn" type="button">다시 강화하기</button>
      </div>
    </div>
  </div>

  <div class="modalOverlay" id="dexModal" role="dialog" aria-modal="true" aria-label="자수정 도감">
    <div class="modalCard">
      <button class="closeBtn" id="dexCloseBtn" type="button" aria-label="닫기">×</button>
      <h2 class="dexHeader">자수정 도감</h2>
      <p class="dexSub" id="dexCountText">0 / 406 수집</p>
      <div class="dexGrid" id="dexGrid"></div>
    </div>
  </div>

<script>
(function(){

  function drawShard(G, mask, sh, hue, sat, light){
    var th = sh.ang*Math.PI/180, ax=Math.sin(th), ay=-Math.cos(th), pxv=Math.cos(th), pyv=Math.sin(th);
    var L = Math.max(10, light+sh.shade);
    var pal = {
      edge: hsl(hue, sat, 15),
      dark: hsl(hue, sat, L-17),
      mid:  hsl(hue, sat, L),
      bright: hsl(hue, sat-6, Math.min(88,L+15)),
      hi: hsl(hue, sat-20, Math.min(96,L+34))
    };
    var tipLen = sh.wid*0.95, cells=[], inMask={}, x, y;
    for (y=0;y<GH;y++) for (x=0;x<GW;x++){
      var dx=x+0.5-sh.bx, dy=y+0.5-sh.by;
      var u=dx*ax+dy*ay, v=dx*pxv+dy*pyv;
      if (u<0 || u>sh.len) continue;
      var hw = u<sh.len-tipLen ? sh.wid/2 : (sh.wid/2)*(sh.len-u)/tipLen;
      if (Math.abs(v)>hw) continue;
      if (u < 0.5*(Math.abs(v)-sh.wid*0.2)) continue;
      var t = v/(sh.wid/2), c;
      if (u>sh.len-tipLen) c = v<0 ? pal.bright : pal.mid;
      else if (t<-0.4) c = pal.mid;
      else if (t<0.28) c = pal.bright;
      else c = pal.dark;
      if (Math.abs(t+0.12)<0.1 && u>sh.len*0.16 && u<sh.len*0.6) c = pal.hi;
      if (u>sh.len-tipLen*0.8 && u<sh.len-tipLen*0.3 && t>-0.5 && t<-0.15) c = pal.hi;
      cells.push([x,y,c]); inMask[x+","+y]=true;
    }
    for (var i=0;i<cells.length;i++){
      var cx=cells[i][0], cy=cells[i][1], cc=cells[i][2];
      if (!inMask[(cx+1)+","+cy] || !inMask[(cx-1)+","+cy] || !inMask[cx+","+(cy+1)] || !inMask[cx+","+(cy-1)]) cc = pal.edge;
      G[cy][cx] = cc; mask[cx+","+cy] = true;
    }
  }

  function drawMound(G){
    for (var y=32;y<GH;y++) for (var x=3;x<GW-3;x++){
      var dx=(x+0.5-20)/15, dy=(y+0.5-38)/5.2;
      if (dx*dx+dy*dy<=1){
        var c = y<34 ? "hsl(28 26% 52%)" : ((x*7+y*3)%5===0 ? "hsl(28 24% 44%)" : "hsl(28 24% 34%)");
        if (dx*dx+dy*dy>0.78) c = "hsl(28 26% 22%)";
        G[y][x]=c;
      }
    }
  }

  function buildGrid(spec, silhouette){
    var G=[], r, c, mask={};
    for (r=0;r<GH;r++) G.push(new Array(GW).fill(null));
    var rand = seededRand((spec.seed||1)*131+7);
    var withScene = spec.scene!==false && !silhouette;
    if (withScene){
      var pal = BG_PAL[spec.bg] || BG_PAL.plain;
      for (r=0;r<GH;r++){
        var t=r/(GH-1);
        var dh=((pal[1][0]-pal[0][0]+540)%360)-180; var hh=(pal[0][0]+dh*t+360)%360, ss=pal[0][1]+(pal[1][1]-pal[0][1])*t, ll=pal[0][2]+(pal[1][2]-pal[0][2])*t;
        for (c=0;c<GW;c++){
          var hdx=c+0.5-20, hdy=r+0.5-20, hd=Math.sqrt(hdx*hdx+hdy*hdy);
          var bonus = hd<9 ? 15 : (hd<13 ? 10 : (hd<17 ? 5 : 0));
          G[r][c]=hsl(hh, ss, Math.min(95, ll+bonus));
        }
      }
      var accH = (pal[0][0]+170)%360, ai;
      for (ai=0;ai<18;ai++){
        var ax=Math.floor(rand()*GW), ay=Math.floor(rand()*GH);
        var ac = hsl(accH+rand()*40, 100, 70);
        setC(G,ax,ay,ac);
        if (ai%4===0){ setC(G,ax+1,ay,ac); setC(G,ax-1,ay,ac); setC(G,ax,ay+1,ac); setC(G,ax,ay-1,ac); }
      }
      var ls = spec.layers||[];
      for (var i=0;i<ls.length;i++) if (LAYER_FN[ls[i]]) LAYER_FN[ls[i]](G, rand, spec);
      if (!ls.length){ LAYER_FN.stars(G, rand); }
    }
    var shape = SHAPES[spec.shape||0];
    if (shape.mound && !silhouette) drawMound(G);
    for (var s=0;s<shape.shards.length;s++) drawShard(G, mask, shape.shards[s], spec.hue, spec.sat, spec.light);
    if (silhouette){
      for (var a=0;a<GH;a++) for (var b=0;b<GW;b++) if (G[a][b]) G[a][b]="#9d94ab";
    }
    return {G:G, mask:mask, rand:rand};
  }

  function spriteMarkup(spec, silhouette){
    var built = buildGrid(spec, silhouette), G = built.G, rects = "", r, c;
    for (r=0;r<GH;r++){
      c=0;
      while (c<GW){
        var col=G[r][c];
        if (!col){ c++; continue; }
        var c2=c;
        while (c2+1<GW && G[r][c2+1]===col) c2++;
        rects += '<rect x="'+(c*PX)+'" y="'+(r*PX)+'" width="'+((c2-c+1)*PX)+'" height="'+PX+'" fill="'+col+'"/>';
        c=c2+1;
      }
    }
    var spark = "";
    if (!silhouette && spec.sparkles>0){
      var rd = built.rand, placed=0, tries=0;
      while (placed<spec.sparkles && tries<80){
        tries++;
        var gx=Math.floor(4+rd()*32), gy=Math.floor(3+rd()*30);
        if (!built.mask[gx+","+gy]) continue;
        placed++;
        spark += '<rect x="'+(gx*PX)+'" y="'+(gy*PX)+'" width="'+PX+'" height="'+PX+'" fill="#fff" class="sparkle" style="animation-delay:'+(rd()*2).toFixed(2)+'s"/>';
      }
    }
    var scene = spec.scene!==false && !silhouette;
    var shadow = scene ? "" : '<ellipse cx="100" cy="188" rx="58" ry="6" fill="hsl('+spec.hue+' 25% 8%)" opacity="0.16"/>';
    return '<svg class="'+(scene?'scenePanel':'')+'" viewBox="0 0 '+(GW*PX)+' '+(GH*PX)+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-hidden="true">'+shadow+rects+spark+'</svg>';
  }

  function shapeFor(i){
    var pool = i<80 ? [0,1,6] : (i<200 ? [0,1,2,5,6,7] : (i<330 ? [2,3,5,7,4,1] : [3,4,7,2,5]));
    return pool[(i*7+3)%pool.length];
  }
  var ULT_LAYERS = [
    ["stars","rays","crown"],["stars","portal","clock"],["stars","aurora","rainbowarc"],["stars","magiccircle","runes"],
    ["rays","portal","wings"],["stars","rays","clock"],["stars","aurora","magiccircle"],["stars","rays","crown"]
  ];

  /* ============ 등급 임계값 ============ */
  var THRESHOLDS = (function(){
    var arr = [];
    var prev = -1;
    var BASE = 1.0525;
    for (var i=0;i<TOTAL;i++){
      var v = Math.floor(Math.pow(BASE, i)) - 1;
      if (v <= prev) v = prev + 1;
      arr.push(v);
      prev = v;
    }
    arr[arr.length-1] = 1000000000;
    return arr;
  })();

  var LEGEND_START = 398; // 상위 8개: 궁극 연출

  var TIERS = (function(){
    var list = [];
    for (var i=0;i<NAMES.length;i++){
      var rarityT = i/(NAMES.length-1);
      var ultimate = i >= LEGEND_START;
      var theme = ultimate ? {hue:292, delta:0, grp:"none"} : themeFor(NAMES[i], i);
      var d = ((theme.hue - 272 + 540) % 360) - 180;
      d = Math.max(-30, Math.min(30, d));
      var crystalHue = Math.round(272 + d*0.9);
      var scene = ultimate ? {bg:"cosmic", layers:ULT_LAYERS[i-LEGEND_START]} : sceneFor(NAMES[i], i);
      var light = Math.round(50 + rarityT*8 + Math.max(-6, Math.min(6, theme.delta*0.3)));
      list.push({
        index: i,
        name: NAMES[i],
        threshold: THRESHOLDS[i],
        hue: crystalHue,
        sat: Math.round(52 + rarityT*30),
        light: light,
        glow: Math.round(3 + rarityT*42),
        sparkles: Math.round(rarityT*12),
        seed: i+1,
        bg: scene.bg,
        layers: scene.layers,
        shape: shapeFor(i),
        blue: NAMES[i].indexOf("푸른 불꽃")!==-1,
        redEyes: /크리퍼|좀비|스켈레톤|워든|약탈자/.test(NAMES[i]),
        legendary: ultimate
      });
    }
    return list;
  })();

  function tierForScore(score){
    var lo=0, hi=THRESHOLDS.length-1, ans=0;
    while (lo<=hi){
      var mid=(lo+hi)>>1;
      if (THRESHOLDS[mid] <= score){ ans=mid; lo=mid+1; } else { hi=mid-1; }
    }
    return ans;
  }

  function maybeTriggerEvent(now, intensity){
    if (now - lastEventAt < Math.max(140, 700*(1-intensity))) return;
    var maxConcurrent = 1 + Math.floor(intensity*3);
    if (activeEventCount >= maxConcurrent) return;
    var chance = Math.pow(intensity,2) * 0.4;
    if (Math.random() > chance) return;
    var pool = [];
    for (var i=0;i<EVENTS.length;i++){
      var e = EVENTS[i];
      if (intensity < e.min) continue;
      if (e.once && earthGoneUsed) continue;
      for (var w=0; w<e.w; w++) pool.push(e);
    }
    if (pool.length===0) return;
    var pick = pool[Math.floor(Math.random()*pool.length)];
    if (pick.once) earthGoneUsed = true;
    lastEventAt = now;
    activeEventCount++;
    setTimeout(function(){ activeEventCount = Math.max(0, activeEventCount-1); }, 1800);
    pick.fn();
  }

  function updateVisuals(now, timeProgress){
    var scoreIntensity = Math.min(1, Math.log10(state.score+1) / 6);
    var intensity = 1 - (1 - 0.92*timeProgress) * (1 - scoreIntensity);
    var ii = intensity*intensity;
    var sec = now/1000;

    var hue = (sec * (18 + 270*ii*intensity)) % 360;
    var hue2 = (hue + 150 + intensity*60) % 360;
    var hue3 = (hue + 260) % 360;
    var hue4 = (hue + 70) % 360;
    var sat = 22 + intensity*78;
    var lightOuter = 97 - intensity*22;
    var coreLight = Math.max(58, lightOuter-30-intensity*8);

    var angle = (sec * (24 + 170*ii)) % 360;
    var angle2 = (360 - (sec * (14 + 55*ii)) % 360);
    var conicAlpha = Math.min(0.95, ii*1.05);
    var rayAlpha = Math.min(0.6, ii*0.7);
    var bx = 50 + Math.cos(sec*0.9)*34*intensity;
    var by = 44 + Math.sin(sec*1.3)*26*intensity;
    var blobAlpha = Math.min(0.85, ii*0.95);

    stageEl.style.background =
      "repeating-conic-gradient(from " + angle2.toFixed(0) + "deg at 50% 44%, " +
        "hsla(" + hue4.toFixed(0) + ",100%,66%," + rayAlpha.toFixed(2) + ") 0deg 24deg, " +
        "hsla(" + hue3.toFixed(0) + ",100%,50%,0) 24deg 48deg), " +
      "radial-gradient(circle at " + bx.toFixed(0) + "% " + by.toFixed(0) + "%, hsla(" + hue3.toFixed(0) + ",100%,60%," + blobAlpha.toFixed(2) + ") 0%, transparent 46%), " +
      "conic-gradient(from " + angle.toFixed(0) + "deg at 50% 44%, " +
        "hsla(" + hue.toFixed(0) + ",100%,62%," + conicAlpha.toFixed(2) + ") 0deg, " +
        "hsla(" + hue2.toFixed(0) + ",100%,64%," + conicAlpha.toFixed(2) + ") 90deg, " +
        "hsla(" + hue3.toFixed(0) + ",100%,60%," + conicAlpha.toFixed(2) + ") 180deg, " +
        "hsla(" + hue4.toFixed(0) + ",100%,64%," + conicAlpha.toFixed(2) + ") 270deg, " +
        "hsla(" + hue.toFixed(0) + ",100%,62%," + conicAlpha.toFixed(2) + ") 360deg), " +
      "radial-gradient(circle at 50% 42%, hsl(" + hue.toFixed(0) + " " + sat.toFixed(0) + "% " + coreLight.toFixed(0) + "%) 0%, " +
        "hsl(" + hue2.toFixed(0) + " " + (sat*0.9).toFixed(0) + "% " + lightOuter.toFixed(0) + "%) 55%, " +
        "var(--bg) 100%)";

    if (!REDUCE_MOTION && intensity>0.28){
      if (now-lastPulseAt > Math.max(80, 480*(1-intensity))){
        lastPulseAt = now;
        spawnPulseRing(hue);
        if (intensity>0.6) spawnPulseRing(hue3);
      }
      if (intensity>0.4 && now-lastConfettiAt > Math.max(60, 300*(1-intensity))){
        lastConfettiAt = now;
        spawnConfetti(hue2, intensity);
      }
    }

    var scoreText = Math.floor(state.score).toLocaleString("ko-KR");
    var availW = Math.min(window.innerWidth*0.92, 400);
    var maxByWidth = availW / (scoreText.length*0.6);
    var fontSize = Math.max(26, Math.min(38 + intensity*150, maxByWidth));
    var numHue = (hue+180)%360;
    scoreDisplay.textContent = scoreText;
    scoreDisplay.style.fontSize = fontSize.toFixed(0) + "px";
    scoreDisplay.style.color = "hsl(" + numHue.toFixed(0) + " 95% " + (46+intensity*14).toFixed(0) + "%)";
    scoreDisplay.style.webkitTextStroke = (intensity>0.25 ? Math.max(2, fontSize*0.035*Math.min(1,intensity*1.4)) : 0).toFixed(1) + "px #fff";
    scoreDisplay.style.paintOrder = "stroke fill";
    scoreDisplay.style.textShadow = "0 0 " + (6+intensity*50).toFixed(0) + "px hsla(" + numHue.toFixed(0) + ",95%,62%," + (0.5+intensity*0.48).toFixed(2) + ")";

    var glow = 4 + intensity*46;
    crystalSvgEl.style.filter = "drop-shadow(0 0 " + glow.toFixed(0) + "px hsla(" + hue.toFixed(0) + ",85%,62%,0.7))";

    if (!REDUCE_MOTION){
      var amp = ii*16;
      var dx = (Math.random()*2-1)*amp;
      var dy = (Math.random()*2-1)*amp*0.6;
      var rot = (Math.random()*2-1)*intensity*4;
      hypeLayer.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) rotate(" + rot.toFixed(2) + "deg)";
    }

    if (eventCaption && now < eventCaptionUntil){
      instructionText.textContent = eventCaption;
    } else {
      eventCaption = "";
      instructionText.textContent = pickHype(intensity, state.holding);
    }
    if (intensity>0.45){ instructionText.style.color = "#fff"; instructionText.style.textShadow = "0 2px 8px rgba(0,0,0,.65)"; instructionText.style.fontWeight = "700"; }

    maybeTriggerEvent(now, intensity);
    return intensity;
  }

  /* ============ 메인 루프 ============ */
  function loop(now){
    if (state.phase !== "enhancing") return;
    var dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;

    var elapsed = (now - state.timerStart) / 1000;
    var remaining = DURATION - elapsed;
    updateTimerDisplay(remaining);

    if (remaining <= 0){
      finalize();
      return;
    }

    if (state.holding){
      state.holdPower *= (1 + dt*GROWTH_RATE);
      var roll = Math.random();
      var mult;
      if (roll > 0.998) mult = 200 + Math.random()*400;
      else if (roll > 0.98) mult = 30 + Math.random()*100;
      else if (roll > 0.90) mult = 4 + Math.random()*8;
      else mult = 0.4 + Math.random()*1.4;
      state.score += state.holdPower * dt * mult * state.runLuck;
    } else {
      state.holdPower *= Math.exp(-POWER_DECAY*dt);
      state.score = Math.max(0, state.score - state.score*SCORE_DECAY*dt);
    }

    updateVisuals(now, Math.min(1, elapsed/DURATION));

    rafId = requestAnimationFrame(loop);
  }

  function onPress(e){
    if (state.phase === "result") return;
    if (e && e.cancelable) e.preventDefault();
    if (state.phase === "idle"){
      state.phase = "enhancing";
      state.score = 0;
      state.holdPower = 1;
      var luckRoll = Math.random();
      state.runLuck = Math.max(0.15, Math.min(25, -Math.log(1-luckRoll*0.995) * 0.6));
      state.timerStart = performance.now();
      lastTime = state.timerStart;
      timerPill.classList.add("show");
      scoreDisplay.classList.add("show");
      updateTimerDisplay(DURATION);
      rafId = requestAnimationFrame(loop);
    }
    state.holding = true;
    crystalBtn.classList.add("pressed");
  }
  function onRelease(){
    if (state.phase !== "enhancing") return;
    state.holding = false;
    crystalBtn.classList.remove("pressed");
  }

  crystalBtn.addEventListener("pointerdown", onPress);
  crystalBtn.addEventListener("pointerleave", onRelease);
  window.addEventListener("pointerup", onRelease);
  window.addEventListener("pointercancel", onRelease);
  crystalBtn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  crystalBtn.addEventListener("touchmove", function(e){ if (e.cancelable) e.preventDefault(); }, {passive:false});
  crystalBtn.addEventListener("keydown", function(e){
    if ((e.key === " " || e.key === "Enter") && !e.repeat){ e.preventDefault(); onPress(e); }
  });
  crystalBtn.addEventListener("keyup", function(e){
    if (e.key === " " || e.key === "Enter"){ e.preventDefault(); onRelease(); }
  });

  function clearFx(){
    eventBack.innerHTML = "";
    eventFront.innerHTML = "";
    activeEventCount = 0;
    earthGoneUsed = false;
  }

  function finalize(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    state.phase = "result";
    state.holding = false;
    crystalBtn.classList.remove("pressed");
    crystalBtn.style.transform = "";
    crystalBtn.style.opacity = "";
    timerPill.classList.remove("show");
    hypeLayer.style.transform = "";
    clearFx();

    var finalScore = Math.max(0, Math.floor(state.score));
    var tierIndex = tierForScore(finalScore);
    var tier = TIERS[tierIndex];

    var best = loadBest();
    if (finalScore > best){ saveBest(finalScore); }

    var unlocked = loadUnlocked();
    var isNew = !unlocked.has(tierIndex);
    if (isNew){ unlocked.add(tierIndex); saveUnlocked(unlocked); }

    showResult(tier, finalScore, isNew);
  }

  function showResult(tier, finalScore, isNew){
    resultCrystalWrap.innerHTML = spriteMarkup(tier);
    var svg = resultCrystalWrap.querySelector("svg");
    svg.style.filter = "drop-shadow(0 0 " + tier.glow + "px hsla(" + tier.hue + ",80%,60%,0.55))";
    if (tier.legendary && !REDUCE_MOTION){ svg.classList.add("legendarySpin"); }

    resultName.textContent = tier.name;
    resultScore.textContent = "도달 수치  " + finalScore.toLocaleString("ko-KR");
    resultBadgeWrap.innerHTML = isNew ? '<span class="badge">새로운 종류 발견!</span>' : "";

    resultModal.classList.add("open");
  }

  function closeResultModal(){
    resultModal.classList.remove("open");
  }
  function resetGame(){
    state.phase = "idle";
    state.score = 0;
    state.holdPower = 1;
    state.holding = false;
    state.timerStart = null;
    scoreDisplay.classList.remove("show");
    scoreDisplay.textContent = "";
    stageEl.style.background = "";
    crystalSvgEl.style.filter = "";
    instructionText.textContent = ORIGINAL_INSTRUCTION;
    instructionText.style.color = ""; instructionText.style.textShadow = ""; instructionText.style.fontWeight = "";
    scoreDisplay.style.webkitTextStroke = "0"; scoreDisplay.style.textShadow = "";
    refreshBestText();
  }

  resultCloseBtn.addEventListener("click", function(){ closeResultModal(); resetGame(); });
  resultRetryBtn.addEventListener("click", function(){ closeResultModal(); resetGame(); });
  resultDexBtn.addEventListener("click", function(){ renderDexGrid(); dexModal.classList.add("open"); });

  /* ============ 도감 ============ */
  var dexCache = {};
  function dexSprite(tier, isUnlocked){
    var k = tier.index + (isUnlocked ? "u" : "l");
    if (!dexCache[k]){
      dexCache[k] = spriteMarkup({hue:tier.hue, sat:tier.sat, light:tier.light, sparkles:0, seed:tier.seed,
                  shape:tier.shape, bg:tier.bg, layers:tier.layers, blue:tier.blue, redEyes:tier.redEyes}, !isUnlocked);
    }
    return dexCache[k];
  }
  function renderDexGrid(){
    var unlocked = loadUnlocked();
    dexCountText.textContent = unlocked.size + " / " + TOTAL + " 수집";
    var html = "";
    for (var i=0;i<TIERS.length;i++){
      var tier = TIERS[i];
      var isUnlocked = unlocked.has(tier.index);
      html += '<div class="dexCell' + (isUnlocked?'':' locked') + '">' +
                '<div class="dexIcon">' + dexSprite(tier, isUnlocked) + '</div>' +
                '<div class="dexName">' + (isUnlocked ? tier.name : "???") + '</div>' +
                '<div class="dexNum">' + tier.threshold.toLocaleString("ko-KR") + '</div>' +
              '</div>';
    }
    dexGrid.innerHTML = html;
  }

  openDexBtn.addEventListener("click", function(){ renderDexGrid(); dexModal.classList.add("open"); });
  dexCloseBtn.addEventListener("click", function(){ dexModal.classList.remove("open"); });
  [resultModal, dexModal].forEach(function(overlay){
    overlay.addEventListener("click", function(e){
      if (e.target === overlay){
        overlay.classList.remove("open");
        if (overlay === resultModal) resetGame();
      }
    });
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (resultModal.classList.contains("open")){ closeResultModal(); resetGame(); }
      if (dexModal.classList.contains("open")){ dexModal.classList.remove("open"); }
    }
  });

})();

</script>
</body>
</html>
